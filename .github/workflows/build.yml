name: Build Windows Agent

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false

      - name: Embed administrator manifest
        shell: pwsh
        run: |
          go install github.com/akavel/rsrc@latest
          $rsrc = Join-Path (go env GOPATH) "bin/rsrc.exe"
          & $rsrc -manifest app.manifest -o rsrc_windows_amd64.syso

      - name: Format and test
        shell: pwsh
        run: |
          gofmt -w *.go
          go test ./...

      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags="-s -w" -o dist/MMD-Remote-Agent.exe .

      - name: Publish latest build to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          target_commitish: main
          name: MMD Remote Agent build ${{ github.sha }}
          prerelease: true
          files: dist/MMD-Remote-Agent.exe
          fail_on_unmatched_files: true

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: MMD Remote Agent ${{ github.ref_name }}
          files: dist/MMD-Remote-Agent.exe
          fail_on_unmatched_files: true
