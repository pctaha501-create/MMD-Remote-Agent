name: Build Windows Agent

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Embed administrator manifest
        shell: pwsh
        run: |
          go install github.com/akavel/rsrc@latest
          $rsrc = Join-Path (go env GOPATH) "bin/rsrc.exe"
          & $rsrc -manifest app.manifest -o rsrc_windows_amd64.syso
      - name: Build
        run: go build -trimpath -ldflags="-s -w" -o dist/MMD-Remote-Agent.exe .
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: MMD-Remote-Agent-windows-amd64
          path: dist/MMD-Remote-Agent.exe
          if-no-files-found: error
      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MMD-Remote-Agent.exe
